name: Build weekly digest

# The weekly pipeline: embed, cluster across languages, LLM analysis, rank,
# publish. This is where every API call happens.

on:
  schedule:
    # Monday morning, covering the Monday-to-Sunday week that just finished.
    # Off the hour: scheduled jobs on the hour queue behind everyone else's.
    - cron: "41 6 * * 1"
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week to build, e.g. 2026-W36 (default: last week)"
        type: string
        default: ""
      no_llm:
        description: "Skip the LLM and use offline heuristic enrichment"
        type: boolean
        default: false
      no_embeddings:
        description: "Skip embeddings (clustering becomes within-language only)"
        type: boolean
        default: false

permissions:
  contents: write

# Shares a group with collection: both commit data/news.db.
concurrency:
  group: news-digest-state
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Only used when EMBEDDING_PROVIDER=local. Harmless otherwise: the key
      # misses, nothing is restored, and the step costs a second.
      - name: Cache the local embedding model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/fastembed
            ~/.cache/huggingface
          key: embed-model-${{ vars.EMBEDDING_MODEL || 'minilm-l12-v2' }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Local embeddings: set repo variable EMBEDDING_PROVIDER=local and
          # uncomment fastembed in requirements.txt, or install the extra here.
          if [ "${{ vars.EMBEDDING_PROVIDER }}" = "local" ]; then
            pip install 'fastembed>=0.8,<0.9'
          fi
          pip install -e .

      - name: Build digest
        env:
          # Add GEMINI_API_KEY under Settings -> Secrets and variables -> Actions.
          # Without it the run still succeeds: enrichment falls back to offline
          # heuristics and clustering to within-language text similarity, which
          # leaves cross-language coverage split. The digest still publishes.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini-3.6-flash' }}
          LLM_ARTICLES_PER_RUN: ${{ vars.LLM_ARTICLES_PER_RUN || '400' }}
          EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER || 'gemini' }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'gemini-embedding-2' }}
          EMBEDDING_DIMENSIONS: ${{ vars.EMBEDDING_DIMENSIONS || '256' }}
          SITE_URL: ${{ vars.SITE_URL }}
          NEWS_DIGEST_USER_AGENT: >-
            news-digest/0.2 (+https://github.com/${{ github.repository }})
        run: |
          news-digest digest \
            ${{ inputs.no_llm && '--no-llm' || '' }} \
            ${{ inputs.no_embeddings && '--no-embeddings' || '' }} \
            ${{ inputs.week && format('--week {0}', inputs.week) || '' }} \
            | tee digest-summary.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Weekly digest"
            echo '```'
            cat digest-summary.txt 2>/dev/null || echo "no summary produced"
            echo '```'
            news-digest stats || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit digest and state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "chore: weekly digest $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1
