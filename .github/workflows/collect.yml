name: Collect articles

# The daily pipeline: fetch, normalize, detect language, deduplicate, store.
# It calls no LLM and no embedding API, so it is cheap enough to run often.

on:
  schedule:
    # Every six hours rather than strictly once a day. Most feeds expose only
    # their ~25 most recent items, so a busy source can publish more than one
    # feed-window between two daily runs and those articles are simply lost.
    # Collection costs nothing but a few HTTP requests, so polling more often is
    # the cheapest possible insurance. For strictly daily, use "23 5 * * *".
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Two runs writing data/news.db at once would race on the commit.
concurrency:
  group: news-digest-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Collect
        env:
          NEWS_DIGEST_USER_AGENT: >-
            news-digest/0.2 (+https://github.com/${{ github.repository }})
        run: news-digest collect | tee collect-summary.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Collection"
            echo '```'
            cat collect-summary.txt 2>/dev/null || echo "no summary produced"
            echo '```'
            news-digest stats || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "no new articles"
            exit 0
          fi
          git commit -m "chore: collect articles $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1
