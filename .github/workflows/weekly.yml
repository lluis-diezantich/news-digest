name: Weekly digest

# The whole pipeline: read the inbox, extract articles, filter, cluster across
# languages, summarize, rank, and commit the Markdown.
#
# One workflow, not two. The RSS version of this project collected four times a
# day and processed weekly, because feeds expose only their most recent items and
# a busy source could publish more than one feed-window between runs. Mail does
# not expire from a mailbox, so there is nothing to poll for.

on:
  schedule:
    # Monday morning, covering the Monday-to-Sunday week that just finished.
    # Off the hour: scheduled jobs on the hour queue behind everyone else's.
    - cron: "41 6 * * 1"
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week to build, e.g. 2026-W38 (default: last week)"
        type: string
        default: ""
      force:
        description: "Re-parse messages already parsed (for a changed extractor)"
        type: boolean
        default: false
      no_llm:
        description: "Skip the LLM and use offline heuristics"
        type: boolean
        default: false
      no_embeddings:
        description: "Skip embeddings (clustering becomes within-language only)"
        type: boolean
        default: false

permissions:
  contents: write

# Two runs writing data/news.db at once would race on the commit.
concurrency:
  group: news-digest-state
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Only used when EMBEDDING_PROVIDER=local. Harmless otherwise: the key
      # misses, nothing is restored, and the step costs a second.
      #
      # FASTEMBED_CACHE_PATH must be set explicitly. Left unset, fastembed 0.8
      # caches under $TMPDIR, which on a runner is wiped between jobs -- so the
      # cache would restore into a directory the library never reads and every
      # run would re-download ~240 MB. The key includes the library major.minor
      # because 0.8 changed MiniLM from CLS to mean pooling, which changes every
      # vector; a cache shared across that boundary would serve stale weights.
      - name: Cache the local embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-0.8-${{ vars.EMBEDDING_MODEL || 'minilm-l12-v2' }}

      - name: Install
        run: |
          echo "FASTEMBED_CACHE_PATH=$HOME/.cache/fastembed" >> "$GITHUB_ENV"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ vars.EMBEDDING_PROVIDER }}" = "local" ]; then
            pip install 'fastembed>=0.8,<0.9'
          fi
          pip install -e .

      - name: Run
        env:
          # --- Mailbox. Add these under Settings -> Secrets and variables.
          # Without them there is no input at all, so this is the one failure
          # that stops the run rather than degrading it.
          NEWS_EMAIL_HOST: ${{ secrets.NEWS_EMAIL_HOST }}
          NEWS_EMAIL_PORT: ${{ vars.NEWS_EMAIL_PORT || '993' }}
          NEWS_EMAIL_USERNAME: ${{ secrets.NEWS_EMAIL_USERNAME }}
          NEWS_EMAIL_PASSWORD: ${{ secrets.NEWS_EMAIL_PASSWORD }}
          NEWS_EMAIL_FOLDER: ${{ vars.NEWS_EMAIL_FOLDER || 'INBOX' }}

          # --- Model. Without a key the run still succeeds: classification and
          # enrichment fall back to offline heuristics and clustering to
          # within-language text similarity, which leaves cross-language coverage
          # split into separate stories. The digest still publishes.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini-3.6-flash' }}
          LLM_ARTICLES_PER_RUN: ${{ vars.LLM_ARTICLES_PER_RUN || '40' }}
          # On a free tier the request COUNT is what runs out, not the tokens.
          LLM_BATCH_SIZE: ${{ vars.LLM_BATCH_SIZE || '16' }}
          LLM_MAX_CLUSTER_CHECKS: ${{ vars.LLM_MAX_CLUSTER_CHECKS || '0' }}

          EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER || 'gemini' }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'gemini-embedding-2' }}
          EMBEDDING_DIMENSIONS: ${{ vars.EMBEDDING_DIMENSIONS || '256' }}
          # Model-specific: 0.82/0.72 suits gemini-embedding-2, 0.80/0.65 the
          # local MiniLM. Set these as repo variables when switching provider.
          EMBEDDING_SIMILARITY_THRESHOLD: ${{ vars.EMBEDDING_SIMILARITY_THRESHOLD }}
          EMBEDDING_AMBIGUOUS_THRESHOLD: ${{ vars.EMBEDDING_AMBIGUOUS_THRESHOLD }}

          NEWS_DIGEST_USER_AGENT: >-
            news-digest/0.3 (+https://github.com/${{ github.repository }})
        run: |
          news-digest run \
            ${{ inputs.no_llm && '--no-llm' || '' }} \
            ${{ inputs.no_embeddings && '--no-embeddings' || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.week && format('--week {0}', inputs.week) || '' }} \
            | tee run-summary.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Weekly digest"
            echo '```'
            cat run-summary.txt 2>/dev/null || echo "no summary produced"
            echo '```'
            news-digest stats || true
          } >> "$GITHUB_STEP_SUMMARY"

      # Committed: the digests, the README block, and the database -- which is how
      # dedupe and the "already parsed" flag survive between runs. NOT committed:
      # anything under debug/, which is gitignored, and raw email bodies, which
      # the run prunes.
      - name: Commit the digest and state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A digests data README.md
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "chore: weekly digest $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1
