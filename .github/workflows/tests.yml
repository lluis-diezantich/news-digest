name: Tests

on:
  push:
    branches: [main]
    # The scheduled job's own commits only touch generated output.
    paths-ignore:
      - "digests/**"
      - "data/**"
      - "README.md"
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest -q

      # The offline path must work with no API key and no model reachable -- what
      # a fork, or a quota-exhausted run, actually takes. It cannot fetch mail, so
      # this exercises everything downstream of a message already in the database.
      - name: Smoke test the offline path
        run: |
          python - <<'PY'
          from pathlib import Path
          from newsdigest.config import load_config
          from newsdigest.inbox import Matcher, assign, parse_message
          from newsdigest.store import Store

          config = load_config()
          matcher = Matcher(config.enabled_sources)
          messages = []
          for path in sorted(Path("tests/fixtures/emails").glob("*.eml")):
              message = parse_message(path.read_bytes())
              source = matcher.match(message)
              assert source is not None, f"{path.name} matches no configured source"
              assign(message, source)
              messages.append(message)
          with Store("/tmp/ci.db") as store:
              assert store.insert_emails(messages) == len(messages)
          PY
          news-digest --db /tmp/ci.db --out /tmp/ci-digests \
            parse --week 2026-W38 --no-links
          news-digest --db /tmp/ci.db --out /tmp/ci-digests \
            digest --week 2026-W38 --no-llm --no-embeddings
          test -f /tmp/ci-digests/2026/2026-W38.md
          test -f /tmp/ci-digests/README.md
          news-digest --db /tmp/ci.db --out /tmp/ci-digests build
          news-digest --db /tmp/ci.db stats

      # The shipped prompts are loaded from files, so a missing or empty one is a
      # runtime failure rather than a syntax error. Render each once.
      - name: Check every prompt renders
        run: |
          python - <<'PY'
          from newsdigest.llm.base import (
              Context, brief_system_prompt, classify_system_prompt,
              enrich_system_prompt, same_event_system_prompt,
          )

          context = Context(output_language="en", interests=["politics"])
          for name, render in [
              ("enrich_article", lambda: enrich_system_prompt(context)),
              ("classify_story", lambda: classify_system_prompt(context)),
              ("write_brief", lambda: brief_system_prompt(context)),
              ("cluster_stories", lambda: same_event_system_prompt(context)),
          ]:
              text = render()
              assert len(text) > 200, f"{name} rendered suspiciously short"
              assert "$" not in text, f"{name} has an unsubstituted placeholder"
              print(f"{name}: {len(text)} chars")
          PY
