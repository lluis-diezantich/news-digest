# Languages, the ranking formula, and digest size.
# Everything here is optional; delete a section to take its defaults.

settings:
  # Languages collected. Detection is restricted to this set, which is what makes
  # it reliable on short headlines.
  supported_languages:
    - en
    - es

  # Language the digest is WRITTEN in, independent of what it reads.
  #   auto  -> whichever language most of the week's items were in
  #   en|es -> always that
  # `auto` is resolved per run, after the window's languages are counted.
  output_language: en

preferences:
  # Either form works:
  #   topics: [technology, economics]        -> each gets weight 1.5
  #   topics: {technology: 1.5, sports: 0.3} -> explicit weights
  # Anything not listed scores 1.0.
  #
  # Empty on purpose. This is the personalization term and the digest is meant to
  # be generic -- "what happened in the world this week", not "what happened that
  # I like". It is also inverted against tag breadth: `politics` is the vaguest
  # tag and the one almost any story gets, so weighting it promotes stories for
  # being vague. Kept as an empty map so the option stays documented.
  topics: {}

  # Penalised rather than hidden, so a genuinely enormous sports story can still
  # surface. Hard exclusion is filters.yaml's job; this is the ranking backstop
  # for what slips through it.
  excluded_topics:
    - sports
    - celebrity

  # Empty on purpose. Outlet quality is already expressed once, in each source's
  # `weight:`. Saying it again as a bonus made it loud enough to distort the
  # shortlist, and with ten sources a favourites subset says very little.
  preferred_sources: []

  # Each distinct hit adds `keyword_bonus`.
  keywords:

ranking:
  # final_score = sum(weight * signal) for the terms listed here.
  # Drop a line to remove that signal entirely; a misspelling is a startup error.
  #
  # ALL OF THESE WEIGHTS ARE UNCALIBRATED. They are carried over from the RSS
  # version of this project, where each was measured against a published top ten
  # -- against a source list that no longer exists. The shape should still hold,
  # and one term should be STRONGER here than it was there, but treat the numbers
  # as a starting point and re-measure with `news-digest explain`.
  terms:
    # The editor's own ordering. In a curated newsletter this is two judgements
    # rather than one: they chose these ten items out of the day's hundreds, and
    # chose which one opens. Primary by intent -- the digest should read like the
    # newsletters it is built from.
    editorial_position: 2.0

    # How many independent outlets covered it. The honest measure of
    # newsworthiness, and 0.00 on every story until embeddings exist, because
    # nothing else groups coverage across languages.
    #
    # Expect much less spread than an RSS source list gives: ten newsletters
    # cannot exceed ten publishers and will rarely pass five. See
    # `corroboration_saturation` below.
    corroboration: 1.5

    # A tiebreak, not a driver. Within one newsletter, position already implies it.
    recency: 0.3
    story_size: 0.2

    # importance and relevance are deliberately ABSENT, and still computed and
    # still shown. On the RSS project a measured week had qwen3:8b returning
    # 0.80-0.85 for every briefed story -- a spread of 0.05 -- so at any weight it
    # contributed a constant and could not reorder anything. Worse, it inverted:
    # stories that were never briefed kept a higher derived value, so being
    # briefed cost a story rank. Put either back only after checking the spread
    # over a real week; `news-digest explain` makes that a measurement.

  keyword_bonus: 0.15
  excluded_penalty: 1.5
  preferred_source_bonus: 0.5

  # Publisher count at which `corroboration` reaches 1.0.
  #
  # UNCALIBRATED, and the most important number here to get right. It has to sit
  # at the top of the range the weeks actually produce: set it too high and the
  # term flattens to nothing, too low and every multi-outlet story ties at 1.000.
  # The RSS project measured 13 over one week across 22 feeds; ten newsletters
  # cannot exceed 10. 5 is a guess. Run `news-digest inspect` and set it to the
  # widest coverage a real week gives you.
  corroboration_saturation: 5

  # Over a weekly window a long half-life is right: Monday's news is still part
  # of the week on Sunday. At 72h Monday scores about 0.16 by Sunday.
  recency_half_life_hours: 72

digest:
  title: "The Week in Global News"
  subtitle: "Synthesized from ten newsletters, in two languages"

  # Section 11 asks for 10-15 major stories plus a few smaller ones. The pipeline
  # enriches 2x (max_stories + minor_stories) candidates and publishes from those.
  max_stories: 12
  # Section 14's "Also worth knowing": listed with a link, not written up.
  minor_stories: 5

  # 1, NOT the RSS project's 3. Ten hand-curated newsletters rarely triple-cover
  # anything, and at 3 most weeks would publish nothing at all. Raise it only
  # once a real week shows enough overlap to afford it -- `news-digest inspect`
  # prints the publisher spread.
  min_articles: 1

  # Weekday the digest window ends on: 0 = Monday ... 6 = Sunday.
  week_ends_on: 6

  # Inline the newest digest into README.md, between its markers.
  update_readme: true

# Geographic spread (section 12). Applied at SELECTION, never to the score: the
# order stays by score, and this only decides which stories make the cut.
regions:
  enabled: true
  # Largest share of the main stories one region may hold before others are
  # promoted. Not a quota -- when a region genuinely holds most of the week's
  # major news the cap runs out of alternatives and those stories publish anyway.
  # At 0.5 with max_stories 12, no region takes more than 6.
  max_share: 0.5

storage:
  # Articles older than this are pruned so the committed database stays small.
  retention_days: 120
  # Email BODIES are emptied this early, and the rows kept. The row is what stops
  # a newsletter being ingested twice; the body is the bulkiest and only
  # sensitive part, and nothing needs it once articles are extracted (section 28).
  email_body_retention_days: 30
  # Embeddings are working data for one run and about 1 KB per article.
  embedding_retention_days: 60
