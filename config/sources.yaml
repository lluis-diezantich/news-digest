# Source list. Adding or removing a source never requires touching code.
#
# Per-source keys:
#   name       (required) unique; identifies this feed
#   publisher  outlet this feed belongs to, defaults to `name`. Several feeds
#              can share one publisher -- corroboration counts PUBLISHERS, so
#              seven El País sections covering one story read as one outlet.
#   languages  what this source publishes in. Constrains language detection and
#              is the fallback when a headline is too short to judge.
#   enabled    default true
#   method     rss (default) | scrape
#   rss        feed URL          -- required for method: rss
#   url        index/section URL -- required for method: scrape
#   weight     0.0-2.0, default 1.0. Feeds into the source_preference signal.
#   topics     hints merged into every article from this source
#   max_items  cap per run, default = defaults.max_items_per_source
#
# scrape-only: link_selector, link_pattern, max_links

defaults:
  max_items_per_source: 25
  # We store only enough text to summarize from, never a full article body.
  # See "Attribution and copyright" in the README.
  excerpt_chars: 1200

sources:
  # ---------------------------------------------------------------- English --
  - name: BBC World
    rss: https://feeds.bbci.co.uk/news/world/rss.xml
    languages: [en]
    weight: 1.2
    topics: [world]

  - name: The Guardian World
    rss: https://www.theguardian.com/world/rss
    languages: [en]
    weight: 1.1
    topics: [world]

  - name: NPR News
    rss: https://feeds.npr.org/1001/rss.xml
    languages: [en]
    weight: 1.0

  - name: Al Jazeera
    rss: https://www.aljazeera.com/xml/rss/all.xml
    languages: [en]
    weight: 1.0
    topics: [world]
  # ---------------------------------------------------------------- Spanish --
  # El País publishes one feed per section. They all share a publisher so a
  # story covered by three sections is not mistaken for three outlets.
  - name: El País Internacional
    publisher: El País
    rss: https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/section/internacional/portada
    languages: [es]
    weight: 1.2
    topics: [world]

  - name: El País España
    publisher: El País
    rss: https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/section/espana/portada
    languages: [es]
    weight: 1.1
    topics: [politics]

  # Same publisher, same events, different language -- the clearest check that
  # cross-language clustering is working.
  - name: El País (English)
    publisher: El País
    rss: https://feeds.elpais.com/mrss-s/pages/ep/site/english.elpais.com/portada
    languages: [en]
    weight: 1.0

  - name: eldiario.es
    rss: https://www.eldiario.es/rss/
    languages: [es]
    weight: 1.0
    max_items: 30

  - name: El Salto
    rss: https://www.elsaltodiario.com/general/feed
    languages: [es]
    weight: 0.9

  - name: La Vanguardia
    # Publishes Spanish and Catalan editions in one feed, so both are declared
    # and detection decides per article.
    rss: https://www.lavanguardia.com/rss/home.xml
    languages: [es, ca]
    weight: 1.0

  # ---------------------------------------------------------------- Catalan --
  - name: Ara
    rss: https://www.ara.cat/rss/
    languages: [ca]
    weight: 1.1
    max_items: 30

  - name: 3Cat (324)
    rss: https://api.ccma.cat/noticies?_format=rss&origen=frontal&frontal=n324-portada-noticia&version=2.0
    languages: [ca]
    weight: 1.1

  - name: VilaWeb
    rss: https://www.vilaweb.cat/rss/
    languages: [ca]
    weight: 1.0

  - name: Nació Digital
    rss: https://www.naciodigital.cat/rss/
    languages: [ca]
    weight: 0.9

  # --------------------------------------------------------------- Disabled --
  # Verified 2026-09-13: works, but ~10 items, often days old, and largely
  # image posts rather than reporting. Enable if you want it.
  - name: Spanish Revolution
    rss: https://spanishrevolution.net/feed/
    languages: [es]
    enabled: false
    weight: 0.6

  # Scraped sources follow. Before enabling any of them, read that site's terms
  # of service: the fetcher honours robots.txt and crawl-delay, but that is a
  # technical control, not permission. (Reuters used to sit here as the example;
  # it was removed on 2026-09-14 because its robots.txt is an allowlist that
  # denies everyone else -- `Allow: /plus/` then `Disallow: /` -- so the fetcher
  # refuses it and the entry could never run.)
  # Scraped, not RSS, and that is deliberate: all 42 of RTVE's feeds are served
  # as .xml, which both robots.txt files disallow -- api2.rtve.es via an
  # allowlist that omits the news feeds, www.rtve.es via `Disallow: /*.xml$`
  # next to `Allow: /*.rss$`. A .rss news feed would be permitted; RTVE
  # publishes none. Its news sitemap is allowed but useless (no titles, newest
  # entry 2025-03). The HTML listing is permitted and carries good metadata, so
  # the stock scrape adapter reads it with no code changes. Verified 2026-09-14.
  # Costs 1 + max_links requests per run, where an RSS source costs 1.
  - name: RTVE Noticias
    publisher: RTVE
    url: https://www.rtve.es/noticias/
    method: scrape
    languages: [es]
    weight: 1.1
    topics: [world]
    link_selector: "article.cell a"
    link_pattern: "\\.shtml$"
    max_links: 12

  # Scraped because there is no alternative: no RSS feed at any path, and none
  # declared in its HTML (verified 2026-09-13). robots.txt permits the homepage
  # and article pages, and the stock adapter reads both with no code changes
  # (verified 2026-09-14). Costs 1 + max_links requests per run.
  - name: Público
    publisher: Público
    url: https://www.publico.es/
    method: scrape
    languages: [es]
    weight: 1.0
    link_selector: "article a"
    link_pattern: "publico.es/.+/.+"
    max_links: 12

  # Verified 2026-09-13: ctxt.es/es/rss serves an HTML page pointing at
  # back.ctxt.es, which returns 403 to every user agent tried. Genuinely closed
  # rather than bot-gated, so there is nothing to enable here yet.
  - name: CTXT
    rss: https://back.ctxt.es/es/static/rss/
    languages: [es]
    enabled: false
