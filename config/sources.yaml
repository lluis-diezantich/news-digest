# Newsletter sources. Adding or removing one never requires touching code.
#
# Recognition is two-part, and both parts matter:
#   senders           addresses or domains this newsletter arrives from. A bare
#                     domain (with or without a leading @) matches that domain
#                     AND its subdomains, because bulk mailers move between
#                     `mail.` and `news.` hosts without notice.
#   subject_patterns  regexes matched against the SUBJECT, accent-stripped and
#                     lowercased. Empty means "any subject from these senders".
#   sender_name_patterns
#                     regexes matched against the From DISPLAY NAME, same
#                     normalisation. For publishers who send through a SHARED
#                     bulk-mail domain -- Público uses `publisher-news.com`, which
#                     identifies nothing -- this is the only reliable
#                     discriminator. Always pair a shared domain with one.
#
# Sender alone is rarely enough: most publishers send every newsletter they have
# from one address, so without a subject rule a weekly digest and a daily
# briefing are the same source. Every rule a source names must pass, and where
# several entries could match one message the one that actively matched a subject
# or display-name pattern wins over a catch-all.
#
# Other per-source keys:
#   newsletter        human name, e.g. "Saturday Edition". Defaults to `name`.
#   publisher         outlet this belongs to, defaults to `name`. Several
#                     newsletters can share one -- corroboration counts
#                     PUBLISHERS, so two EL PAÍS newsletters on one story are one
#                     outlet's view of it, not two.
#   languages         what it publishes in. Constrains language detection and is
#                     the fallback when a headline is too short to judge.
#   enabled           default true. A disabled source may omit `senders`.
#   weight            0.0-2.0, default 1.0. Feeds source_preference and pre-ranking.
#   topics            hints merged into every item from this source
#   excerpt_chars     cap on the blurb stored per item
#
# THE SENDER ADDRESSES BELOW ARE PLACEHOLDERS. Subscribe from the dedicated
# inbox, then run `news-digest sources --check`: it reports what each rule
# matched over the last 30 days and lists every sender that matched nothing,
# which is where a wrong address shows up. Fix them here until nothing is NONE.

defaults:
  # We store only enough text to summarize from, never a full article body.
  # See doc/attribution.md.
  excerpt_chars: 1200

  # Most items to keep from one ISSUE, trimmed from the end because document
  # order is the editor's own ranking. 0 means no limit.
  #
  # Off by design. Measured per issue on 2026-10-03 the spread was 17, 16, 14,
  # 11, 11, 10, 7, 5, 5 -- the Guardian's "This Is Europe" is a prose letter and
  # sits at the top, the rest are digests -- and that is newsletters being
  # different lengths, not one misbehaving. Any cap tight enough to level it
  # would discard real articles from the longest issue.
  #
  # The knob is here for a source that genuinely floods (a daily mis-subscribed
  # as a weekly, a template change that doubles its links). Share of the
  # PUBLISHED digest is a separate question, handled at the cut by
  # `regions.max_share` and `digest.topic_max_share`, which is the better place:
  # it caps what a reader sees without throwing away candidates first.
  max_items: 0

# Dropped at parse time, before anything reaches the database. Regexes, matched
# against the item's URL.
#
# This still works with newsletters, but only on a RESOLVED url. A newsletter
# links through a click tracker, and a tracker has no section path at all -- so
# every pattern here silently matches nothing until `extract/links.py` has
# unwrapped the link. That is why link resolution is not optional in a real run:
# with `--no-links` this whole list is inert.
exclude_url_patterns:
  - /deportes?/          # es
  - /esports?/           # ca
  - /sports?/            # en
  - /futbol/
  - /football/
  - /loterias?/
  - /horoscopo?s?/
  - /el-tiempo/
  - /ir_anuncio/         # El Salto's ad-slot redirect ("go_advert")
  - /suscribirse/
  - /suscripcion/
  - /gente/              # es celebrity sections
  - /celebrit(y|ies)/
  - /moda/
  - /fashion/
  - /recetas?/
  - /recipes?/

exclude_title_patterns:
  # Service content filed under a main news path, which no URL pattern reaches.
  - prevision del tiempo
  - el tiempo para
  - horoscopo
  - resultados de la loteria

sources:
  # --- Global / English -----------------------------------------------------
  - name: aljazeera
    newsletter: Weekly Newsletter
    publisher: Al Jazeera
    languages: [en]
    # Verified 2026-10-03: arrives from `newsletter@sbmail.aljazeera.com`.
    # The .net domain never sent anything; kept in case it comes back.
    senders: ["@aljazeera.com", "@aljazeera.net"]
    topics: [world]

  - name: guardian-saturday
    newsletter: Saturday Edition
    publisher: The Guardian
    languages: [en]
    senders: ["@theguardian.com", "@email.theguardian.com"]
    # The Guardian sends a dozen newsletters from one address, so this one has
    # to be named or every briefing it publishes becomes a source.
    subject_patterns: ["saturday edition"]

  # Added 2026-10-03: subscribed and arriving. Note the domain is `editorial.`,
  # not the `email.` that the account mail uses -- the two are separate senders.
  # Every issue is written by a different correspondent, so the display name is
  # an author's name and useless here; the subject suffix is the stable part.
  - name: guardian-this-is-europe
    newsletter: This Is Europe
    publisher: The Guardian
    languages: [en]
    senders: ["@editorial.theguardian.com"]
    subject_patterns: ["this is europe"]
    topics: [world]

  - name: reuters-world
    newsletter: Reuters World News
    publisher: Reuters
    languages: [en]
    senders: ["@reuters.com", "@newsletters.reuters.com"]
    subject_patterns: ["world", "the daily briefing", "weekend"]

  - name: semafor-flagship
    newsletter: Flagship
    publisher: Semafor
    languages: [en]
    senders: ["@semafor.com"]
    subject_patterns: ["flagship"]

  - name: economist-weekly
    newsletter: The Economist this week
    publisher: The Economist
    languages: [en]
    senders: ["@economist.com", "@news.economist.com"]
    subject_patterns: ["the world this week", "espresso", "this week"]

  # --- Spanish --------------------------------------------------------------
  - name: elpais-weekly
    newsletter: EL PAÍS weekly digest
    publisher: EL PAÍS
    languages: [es]
    senders: ["@elpais.com", "@email.elpais.com"]
    subject_patterns: ["semana", "resumen", "lo mas importante"]

  - name: eldiario-director
    newsletter: Boletín del director
    publisher: elDiario.es
    languages: [es]
    senders: ["@eldiario.es"]
    subject_patterns: ["boletin del director", "carta del director"]

  # Added 2026-10-03: subscribed and arriving. Shares the @eldiario.es domain
  # with the director's boletin, and its subjects are plain headlines with no
  # recurring phrase -- so the display name, which names the newsletter
  # ("elDiario.es | La Semana Internacional"), is the only reliable rule.
  - name: eldiario-internacional
    newsletter: La Semana Internacional
    publisher: elDiario.es
    languages: [es]
    senders: ["@eldiario.es"]
    sender_name_patterns: ["la semana internacional"]
    topics: [world]

  # Added 2026-10-03: subscribed and arriving. The inverse case -- the display
  # name is the author's ("Neus Tomas"), which changes, while the address is
  # fixed. Matched on the FULL address, not the domain, so it cannot swallow the
  # other @eldiario.es newsletters.
  - name: eldiario-catalunya
    newsletter: Carta des de Catalunya
    publisher: elDiario.es
    languages: [ca]
    senders: ["catalunya@eldiario.es"]

  - name: rne-7dias
    newsletter: 7 días
    publisher: RNE
    languages: [es]
    senders: ["@rtve.es"]
    subject_patterns: ["7 dias", "siete dias"]

  - name: orden-mundial
    newsletter: Esta Semana
    publisher: El Orden Mundial
    languages: [es]
    senders: ["@elordenmundial.com"]
    # Verified 2026-10-03: the weekly subject is "Tu boletin semanal con los
    # ultimos contenidos de EOM", not "esta semana". The "Blitz" issues arrive
    # from the same address and deliberately do not match -- different cadence.
    subject_patterns: ["esta semana", "boletin semanal"]

  # Not in the original source list. Added 2026-09-20 because it is subscribed
  # and is a genuine weekly round-up ("Actualidad semanal en El Salto"), which is
  # exactly what this digest is built from. Sends from its own domain, so the
  # sender rule alone is safe here.
  - name: el-salto
    newsletter: Actualidad semanal
    publisher: El Salto
    languages: [es]
    senders: ["@elsaltodiario.com"]
    subject_patterns: ["temas de la semana", "actualidad semanal"]

  - name: publico-pocas-palabras
    newsletter: En pocas palabras
    publisher: Público
    languages: [es]
    # Público sends through Piano, whose domain is shared and says nothing about
    # who the publisher is -- so the display name is what identifies it, and both
    # rules must pass. Verified against a real issue on 2026-09-20: From was
    # `Público - Hoy en Público <news@publisher-news.com>`, nothing at publico.es.
    #
    # The subject pattern still names the WEEKLY. The daily "Hoy en Público"
    # arrives from the same sender and will not match, which is deliberate: this
    # is a weekly digest. Subscribe to "En pocas palabras" and confirm with
    # `news-digest sources --check`.
    senders: ["@publisher-news.com", "@publico.es"]
    sender_name_patterns: ["publico"]
    subject_patterns: ["en pocas palabras"]

  # Added 2026-10-03: a SECOND Publico weekly, through the same Piano domain.
  # Distinguished from "En pocas palabras" by subject alone -- both carry a
  # "... de Publico" display name, so that rule only establishes the publisher.
  # Shares `publisher: Publico` deliberately: corroboration counts publishers,
  # so the two together are one outlet's view of a story, not two.
  - name: publico-temas-semana
    newsletter: Los temas de la semana
    publisher: Público
    languages: [es]
    senders: ["@publisher-news.com", "@publico.es"]
    sender_name_patterns: ["publico"]
    subject_patterns: ["temas de la semana"]
