[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-digest"
version = "0.3.0"
description = "Personal weekly news digest: newsletters by email -> extract -> filter -> cluster -> LLM -> markdown"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.32",
    "python-dateutil>=2.9",
    "beautifulsoup4>=4.12",
    "py3langid>=0.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Local embeddings. ONNX rather than PyTorch, so the CI image stays small.
local = ["fastembed>=0.8,<0.9"]

[project.scripts]
news-digest = "newsdigest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
