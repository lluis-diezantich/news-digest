[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-digest"
version = "0.1.0"
description = "Personal news aggregator: RSS/scrape -> normalize -> dedupe -> LLM enrich -> cluster -> static feed"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "PyYAML>=6.0",
    "requests>=2.32",
    "python-dateutil>=2.9",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
news-digest = "newsdigest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
